services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: m4w_dev
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailserver:
        condition: service_started
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: m4w_dev
      # Filled in after the one-time Stalwart setup (see README): create an
      # account, a catch-all alias for its domain, and an App Password for it.
      STALWART_JMAP_URL: http://mailserver:8080
      STALWART_JMAP_USER: admin@m4w.local
      STALWART_JMAP_PASSWORD: app_aaaaaamls0axqze3ks0oidx3a0jwdwlrmuaq
    ports:
      - "4000:4000"
    volumes:
      # Bind-mount the source so edits on the host are picked up by Phoenix's
      # code reloader without rebuilding the image.
      - .:/app
      # Named volumes for build artifacts and caches, so they don't get
      # shadowed by (or pollute) the host bind mount above, and survive
      # `docker compose down` / restarts.
      - app_deps:/app/deps
      - app_build:/app/_build
      - app_mix:/root/.mix
      - app_hex:/root/.hex

  mailserver:
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    # No STALWART_RECOVERY_ADMIN here: in this version it doesn't wire up to
    # the setup wizard's login screen. Read the one-time generated admin
    # password from the logs instead (see README) — only needed once, for
    # the initial setup wizard.
    ports:
      - "8080:8080" # Admin UI + JMAP
      - "25:25" # SMTP (unauthenticated, for sending test mail between containers)
      - "587:587" # SMTP submission (authenticated, for sending test mail from the host)
    volumes:
      - stalwart_etc:/opt/stalwart/etc
      - stalwart_data:/opt/stalwart/data

volumes:
  app_deps:
  app_build:
  app_mix:
  app_hex:
  stalwart_etc:
  stalwart_data:
