services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: m4w_dev
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailserver:
        condition: service_started
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: m4w_dev
      # Filled in by `./scripts/bootstrap_stalwart.sh` (see README) after it
      # provisions the mail server — no manual GUI setup needed.
      STALWART_JMAP_URL: http://mailserver:8080
      STALWART_JMAP_USER: ${STALWART_JMAP_USER:-}
      STALWART_JMAP_PASSWORD: ${STALWART_JMAP_PASSWORD:-}
      # Space design (M4w.Design) — see backend/.env.example. Left unset,
      # the app falls back to the free M4w.Design.Providers.Stub.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DESIGN_MODEL: ${DESIGN_MODEL:-claude-sonnet-5}
    ports:
      - "4000:4000"
    volumes:
      # Bind-mount the source so edits on the host are picked up by Phoenix's
      # code reloader without rebuilding the image.
      - .:/app
      # Named volumes for build artifacts and caches, so they don't get
      # shadowed by (or pollute) the host bind mount above, and survive
      # `docker compose down` / restarts.
      - app_deps:/app/deps
      - app_build:/app/_build
      - app_mix:/root/.mix
      - app_hex:/root/.hex

  mailserver:
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    environment:
      # Pins a recovery admin login so `./scripts/bootstrap_stalwart.sh` (and
      # you, if something breaks) can always authenticate over the
      # management API, even before/without the normal admin account. Fine
      # to leave set permanently on this local-only dev instance; see
      # https://stalw.art/docs/configuration/recovery-mode/ for why
      # upstream advises against that in production.
      STALWART_RECOVERY_ADMIN: admin:${STALWART_ADMIN_PASSWORD:?Set STALWART_ADMIN_PASSWORD in backend/.env}
    ports:
      - "8080:8080" # Admin UI + JMAP
      - "25:25" # SMTP (unauthenticated, for sending test mail between containers)
      - "587:587" # SMTP submission (authenticated, for sending test mail from the host)
    volumes:
      # NB: these paths are where this image actually reads/writes config
      # and data (`docker inspect stalwartlabs/stalwart:v0.16` shows
      # `Cmd: ["--config", "/etc/stalwart/config.json"]` and
      # `Volumes: ["/etc/stalwart", "/var/lib/stalwart"]`) — not
      # `/opt/stalwart/*`, which some older guides reference. Mounting the
      # wrong path silently no-ops: the container falls back to an
      # anonymous volume, so state still persists across a plain `restart`
      # but quietly resets on every recreate.
      - stalwart_etc:/etc/stalwart
      - stalwart_data:/var/lib/stalwart

volumes:
  app_deps:
  app_build:
  app_mix:
  app_hex:
  stalwart_etc:
  stalwart_data:
